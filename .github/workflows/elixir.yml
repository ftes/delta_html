# separate terms of service, privacy policy, and support
# documentation.

name: Elixir CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

env:
  MIX_ENV: test

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Setup languages
        uses: jdx/mise-action@v2
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: quill_harness/package-lock.json
      - name: Install dependencies
        run: mix deps.get
      - name: Setup Quill harness
        run: mix quill.setup
      - name: Check Formatting
        run: mix format --check-formatted
      - name: Run Credo
        run: mix credo --strict
      - name: Compiles without warnings
        run: mix compile --warnings-as-errors
      - name: Run tests
        run: "mix test --warnings-as-errors"
      - name: Restore PLT cache
        id: plt-cache
        uses: actions/cache/restore@v4
        with:
          path: priv/plts
          key: ${{ runner.os }}-mix-test-plts-${{ hashFiles('mix.lock', '.tool-versions') }}
      - name: Create PLTs
        if: steps.plt-cache.outputs.cache-hit != 'true'
        run: mix dialyzer --plt
      - name: Save PLT cache
        if: steps.plt-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: priv/plts
          key: ${{ steps.plt-cache.outputs.cache-primary-key }}
      - name: Run Dialyzer
        run: mix dialyzer
